cv:
  name: RP Pornmongkolsuk
  headline:
  location: Durham, NC
  email: rp280@duke.edu
  website: http://www.arepee.me
  sections:
    Summary: 
      - > 
        A Ph.D. candidate in population genetics with a natural curiosity 
        about human adaptations, a strong foundation in statistical and computational 
        approaches, and a deep passion for engaging non-scientific audiences through 
        multimedia storytelling.
    Education:
      - institution: Duke University
        area: Genetics and Genomics
        degree: PhD
        date:
        start_date: 2021-08
        end_date: present
        location: Durham, NC
        summary:
        highlights:
      - institution: Brown University
        area: Biology
        degree: BA
        date:
        start_date: 2017-08
        end_date: 2021-05
        location: Providence, RI
        summary:
        highlights:
    Graduate Research Experience:
      - company: Alejandro Ochoa Lab
        position: Graduate Researcher
        start_date: 2022-05
        end_date: present
        location: Duke University
        summary:
        highlights:
          - >
            *Project*: Leveraging ancient DNA in studying human adaptation 
            to vivax malaria in Africa in admixture context.
          - >
            Developing a novel, regression-based single-nucleotide imputation approach 
            that improves imputation accuracy on ancient African DNA which are challenging due to 
            (1) low coverage of ancient DNA sequences and 
            (2) low linkage disequilibrium among African populations.
          - >
            Benchmarked performance of the low-coverage imputation tool GLIMPSE2 
            in the imputation of ancient African genomes using simulations (SLiM, Msprime, Tskit).
          - >
            Built and performed pipelines for nucleotide imputation of the Duffy antigen receptor locus 
            with custom African reference panel using Minimac4 and Beagle5.4 on ancient African genomes. 
            Performance evaluation of above imputations was done via leave-one-out cross-validation.
          - >
            Characterized population structures in ancient and modern African human sequencing data 
            using Principal Component Analyses (PCA), $$F_("ST")$$, $$F$$-statistics, ADMIXTURE software and the popkin R package.
      - company: Amy Goldberg Lab
        position: Rotation Graduate Researcher
        start_date: 2022-03
        end_date: 2022-04
        location: Duke University
        highlights:
          - >
            Developed a pipeline for joint analyses of archaeological (radiocarbon dating) 
            and genetic data (whole genome sequences) in studying the Neolithic Revolution
            —a wide-scale transition into agricultural society promoting population growth
            —in East Asian populations.
      - company: Craig Lowe Lab
        position: Rotation Graduate Researcher
        start_date: 2022-01
        end_date: 2022-02
        location: Duke University
        highlights:
          - >
            Designed and programmed a genome simulation algorithm 
            as part of the novel genomic toolkit (Gonomics) using Golang.
          - >
            The program simulates genetic sequences from populations under 
            the Wright-Fisher model with adjustable (1) population size, 
            (2) number of generations, (3) mutation rate & (4) selection coefficient. 
            The simulation extends beyond the Wright-Fisher model’s infinite-site assumption, 
            allowing back mutation and multiallelic polymorphism in the simulated sequences.
      - company: Jenny Tung Lab
        position: Rotation Graduate Researcher
        start_date: 2021-11
        end_date: 2021-12
        location: Duke University
        highlights:
          - >
            Built a linear mixed-effect regression model for studying 
            the effects of energy expenditure (3-dimensional motionmeasured by accelerometers) 
            on gene expression (bulk RNAseq data) in Kalahari meerkats. 
            The model included random effects from kinship coefficients from known pedigrees.
      - company: Mohamed Noor Lab
        position: Rotation Graduate Researcher
        start_date: 2021-09
        end_date: 2021-10
        location: Duke University
        highlights:
          - >
            Implemented the GATK best practice pipeline to 
            prepare and analyze sequencing data generated from Drosophila melanogaster.
    Undergraduate Research Experience:  
      - company: Emilia Huerta-Sanchez lab
        position: Undergraduate Research Assistant
        date:
        start_date: 2020-06
        end_date: 2021-05
        location: Brown University
        highlights:
          - >
            Detected signals of adaptive introgression in MUC19, a gene encoding a 
            gel-forming mucin protein, from Denisovans in admixed American populations.
          - >
            Assisted in the identification of Native American and European 
            ancestries in the American populations from the 1000 Genomes Project.
          - >
            Calculated genetic distances between haplotypes from Native American 
            ancestries in comparison to the Denisovan haplotype using the program Haplostrips.
          - >
            Constructed and analyzed the Principal Components (PCA) of genetic distances 
            among the admixed American populations.
          -  >
            Designed, built, and maintained the Huerta-Sanchez laboratory website on 
            Weebly platform, created illustrations of the research topics page on the lab website.
      - company: Laboratory of Animal Cytogenetics and Comparative Genomics (ACCG)
        position: Undergraduate Research Assistant
        start_date: 2019-06
        end_date: 2019-07
        location: Kasetsart University, Bangkok, Thailand
        highlights:
          - >
            Conducted and assisted conservation studies of vertebrate species 
            from different zoos in Thailand
          - >
            Performed DNA extraction and Polymerase Chain Reaction (PCR) 
            from blood samples collected from the zoos (Bats and Macaques)
          - >
            Utilized various molecular biology techniques to study the genetic diversity 
            and structure of Lyle’s Flying Foxes (Pteropus lylei ) in Thailand
          - >
            Collected bone marrow tissue from amphibian specimens for Fluorescence 
            in situ Hybridization (FISH) in cytogenetic studies
          -  >
            Assisted in FISH to examine sex determination patterns in the amphibian species
          - >
            Facilitated the Thai-English translations of scientific manuscripts and grant proposals
    Teaching Experience:
      - name: "BIO202: Intro to Genetics and Evolution"
        summary: Graduate Teaching Assistant
        date: Fall semesters 2025 & 2026
        location: Duke University
        highlights:
          - Independently supervised and taught weekly lab sections.
          - >
            Assisted students in understanding genetics and evolutionary concepts 
            during office hours and exam reviews.
          - Engaged in and lead Canvas discussions on genetics and evolution in the news.
          - Graded weekly lab assignments.
      - name: Science Day
        summary: Guest Instructor
        date: March 2025
        location: Creech Road Elementary, Clayton, NC
        highlights:
          - Conducted a hands-on lesson on using Monster Maker game and candy DNA exercise for fifth graders at Creech Road Elementary School.
      - name: Intro to Data Analysis
        summary: Instructor
        date: January 2025
        location: North Carolina School of Science and Mathematics (NCSSM)
        highlights:
          - Instructed an introduction to data analysis using R to the high-school students during their January Term at the North Carolina School of Science and Mathematics (NCSSM). Experience shared on LinkedIn.
          - Led a poster design session where students designed posters for presenting their January Term research findings.
          - >
            Selected testimonies:
            * "Goated lesson. Very engaging and helpful, like the flexibility, energy, and analogy explanations."
            * "Loved the class! Really helped me get a better grasp on programming with R..."
      - name: Bioinformatics Bootcamp
        summary: Instructor
        date: Summers 2022-2024
        location: Duke University
        highlights:
          - >
            Designed and instructed various bioinformatics lessons for the incoming PhD students in the Genetics and Genomics program:
            * 2024 lesson: Data Exploration and Cleanup in R.
            * 2023 lessons: Introduction to Programming Using Python & Data Exploration Using Jupyter Notebook.
            * 2022 lesson: Introduction to Unix and Command Line.
          - Adapted and maintained the Bootcamp website via GitHub.
      - name: "Genetics"
        summary: Undergraduate Teaching Assistant
        date: Falls 2018 & 2019
        location: Brown University
        highlights:
          - Held office hours for weekly assignments, taught in review sections for exams, graded the weekly assignments.
    Leadership Experience:
      - name: "Committee of Alumni, Marketing, and PR (cAMP)"
        summary: Co-Chair
        start_date: 2024-10
        end_date: 2026-05
        location: Duke University
        highlights:
          - Lead a committee focusing on building the UPGG alumni network on LinkedIn, creating and maintaining positive public image for the students in the program, and engage the student body with the broader scientific community on social media.
      - name: "Distinguished Lecture Series Committee"
        summary: Co-Chair
        start_date: 2022-10
        end_date: 2025-01
        location: Duke University
        highlights:
          - Organized the Distinguished Lecture Series in which we invite distinguished scientists who have made notable contributions to their fields and are great mentors and communicators.
    Talks, Conferences, and Workshops:
      - name: "ComSciCon-Triangle Workshop"
        summary: Participant
        date: January 2026
        location: Durham, NC
        highlights:
          - Participated in a Write-A-Thon which involved writing a science news article covering interesting recent scientific finding (in-progress).
          - Gave a one-minute, impromptu pop talk about my research (video uploaded on YouTube).
          - Engaged with a panel of science writing experts on topics including how to write a science article, use effective visual storytelling, and more. Experience shared on LinkedIn.
      - name: "American Society of Human Genetics (ASHG) Annual Meeting"
        date: November 2025
        location: Boston, MA
      - name: "Science Talk '25"
        summary: Participant
        date: April 2025
        location: Raleigh, NC
        highlights:
          - Participated in three-day conference on various topics on science communications.
      - name: "Alan Alda Center for Communicating Science Workshop"
        summary: Participant
        date: January 2025
        location: Durham, NC
        highlights:
          - Engaged in two-day hands-on science communication workshop using improvisational techniques based on the Alda Method. Experience shared on LinkedIn.
      - name: "ComSciCon-Triangle Workshop"
        summary: Participant
        date: January 2025
        location: Chapel Hill, NC
        highlights:
          - Participated in a Write-A-Thon which involved writing a science news article covering interesting recent scientific finding (in-progress).
          - Gave a one-minute, impromptu pop talk about my research (video uploaded on YouTube).
          - Engaged with a panel of science writing experts on topics including how to write a science article, use effective visual storytelling, and more. Experience shared on LinkedIn.
      - name: "American Society of Human Genetics (ASHG) Annual Meeting"
        summary: Poster Presentation
        date: November 2024
        location: Denver, CO
        highlights:
          - "Poster presentation: Evaluation of imputation methods for ancient African DNA."
      - name: "GradX Talk"
        summary: Speaker
        date: March 2024
        location: Duke University
        highlights:
          - "A 5-minute talk titled: How population genetics helps inform us of how we became who we are to general audience."
      - name: "American Society of Human Genetics (ASHG) Annual Meeting"
        summary: Poster Presentation
        date: November 2023
        location: Washington, D.C.
        highlights:
          - "Poster presentation: Single-locus imputation of ancient African DNA using novel regression-based approach."
      - name: "Communicate Your Science through Short Video Workshop"
        summary: Participant
        date: August 2023
        location: Duke University
        highlights:
          - Wrote, filmed, and edited a science communication short video (YouTube or LinkedIn).
      - name: "Society for Molecular Biology & Evolution (SMBE) Annual Meeting"
        summary: Remote Attendee
        date: July 2023
        location: Remote Attendance
        highlights:
      - name: "AGAR Workshop on Computational Genetics"
        summary: Participant
